<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOL 知识库 · 推特实战交易员公开推文归档</title>
<meta name="description" content="把推特实战交易员散落在时间线里的公开推文，按主题整理成可以系统阅读的档案。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*@@BASE_CSS@@*/
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }

.hero { padding: 96px 0 56px; max-width: 820px; }
.hero h1 { font-family: var(--serif); font-size: 48px; line-height: 1.35; color: var(--ink); font-weight: 700; margin: 18px 0 22px; letter-spacing: .01em; }
.hero p { font-size: 18px; max-width: 680px; margin: 0; }
.totals { display: flex; flex-wrap: wrap; margin-top: 44px; border-top: 1px solid var(--rule); }
.totals div { padding: 16px 36px 0 0; }
.totals b { display: block; font-family: var(--mono); font-weight: 500; font-size: 26px; color: var(--ink); line-height: 1.3; }
.totals span { font-family: var(--sans); font-size: 12px; color: var(--muted); }

.sec { padding-top: 56px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
.sec-head h2 { font-family: var(--serif); font-size: 30px; color: var(--ink); margin: 0; font-weight: 700; }
.sec-head p { font-family: var(--sans); font-size: 13px; color: var(--muted); margin: 0; }

/* cards */
.card { display: flex; flex-direction: column; text-decoration: none; color: inherit; border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; background: var(--paper); transition: border-color .2s, transform .2s, box-shadow .2s; }
.card:hover { border-color: color-mix(in srgb, var(--muted) 55%, var(--rule)); transform: translateY(-2px); box-shadow: 0 10px 30px -18px rgb(0 0 0 / .35); }
.cover { position: relative; aspect-ratio: 2.1 / 1; background: var(--paper-2); border-bottom: 1px solid var(--rule); }
.cover svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cover .area { fill: var(--accent-soft); }
.cover .line { fill: none; stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; opacity: .75; }
.cover .grid { stroke: var(--rule); stroke-width: 1; vector-effect: non-scaling-stroke; }
.cover .yr { position: absolute; bottom: 4px; transform: translateX(-2px); font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.cover .peak { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--paper-2); }
.cover .cap { position: absolute; right: 12px; top: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.card .avatar { position: absolute; left: 20px; bottom: -22px; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--rule); background: var(--paper-3); }
.card-body { padding: 34px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card .rib { font-family: var(--sans); font-size: 11.5px; letter-spacing: .12em; color: var(--accent); font-weight: 500; }
.card .who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card .who b { font-family: var(--serif-latin); font-size: 22px; color: var(--ink); font-weight: 600; line-height: 1.3; }
.card .who span { font-family: var(--sans); font-size: 12.5px; color: var(--muted); }
.card .book { font-family: var(--serif); font-size: 16.5px; color: var(--ink); line-height: 1.6; font-weight: 600; margin: 2px 0 0; }
.card .sum { font-size: 14.5px; line-height: 1.8; margin: 0; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .kpis { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; gap: 22px; font-family: var(--sans); font-size: 11.5px; color: var(--muted); }
.card .kpis b { display: block; font-family: var(--mono); font-weight: 500; font-size: 15px; color: var(--ink); }

.feature { display: grid; grid-template-columns: 1.15fr 1fr; margin-bottom: 24px; }
.feature .cover { aspect-ratio: auto; min-height: 320px; border-bottom: 0; border-right: 1px solid var(--rule); }
.feature .avatar { left: 28px; top: 24px; bottom: auto; width: 56px; height: 56px; }
.feature .card-body { padding: 36px 40px 30px; gap: 10px; }
.feature .who b { font-size: 32px; }
.feature .book { font-size: 20px; }
.feature .sum { -webkit-line-clamp: 5; font-size: 15.5px; }
.feature .tags { font-family: var(--sans); font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.feature .tags span::before { content: "#"; color: var(--accent); margin-right: 2px; }

.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.card[hidden] { display: none; }
.none { font-family: var(--sans); font-size: 14px; color: var(--muted); padding: 30px 0; }

.mono-card { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; border: 1px solid var(--rule); border-radius: 16px; padding: 26px 30px; background: var(--paper-2); }
.mono-card h3 { font-family: var(--serif); font-size: 22px; color: var(--ink); margin: 6px 0 6px; }
.mono-card p { margin: 0; font-size: 15px; line-height: 1.8; }
.mono-card .meta { font-family: var(--sans); font-size: 12.5px; color: var(--muted); }
.mono-card .acts { display: grid; gap: 8px; }
.btn { font-family: var(--sans); font-size: 13px; text-decoration: none; text-align: center; border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 7px 18px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }

.site-footer { margin: 80px 0 60px; }

@media (max-width: 1000px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .feature { grid-template-columns: 1fr; }
  .feature .cover { min-height: 0; aspect-ratio: 2.1 / 1; border-right: 0; border-bottom: 1px solid var(--rule); }
  .feature .avatar { left: 20px; top: auto; bottom: -22px; width: 48px; height: 48px; }
  .feature .card-body { padding: 40px 24px 24px; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 18px; }
  .hero { padding: 56px 0 40px; }
  .hero h1 { font-size: 32px; }
  .hero p { font-size: 16px; }
  .grid { grid-template-columns: 1fr; }
  .feature .who b { font-size: 26px; }
  .mono-card { grid-template-columns: 1fr; padding: 22px; }
  .wordmark { display: none; }
}
</style>
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="index.html">KOL 知识库</a>
  <nav class="crumb"><span>推特实战交易员公开推文归档</span></nav>
  <div class="spacer"></div>
  <label class="search">
    <span aria-hidden="true" style="color:var(--muted)">⌕</span>
    <input id="q" type="search" placeholder="按名字、方向筛选交易员…" autocomplete="off">
    <kbd>/</kbd>
  </label>
  <button class="icon-btn" id="themeBtn" aria-label="切换明暗">◐</button>
</header>

<div class="wrap">
  <section class="hero" id="hero"></section>
  <section class="sec" id="list">
    <div class="sec-head"><h2>交易员名录</h2><p id="listMeta"></p></div>
    <div id="feature"></div>
    <div class="grid" id="grid"></div>
    <div class="none" id="none" hidden>没有匹配的交易员。</div>
  </section>
  <section class="sec" id="monographs"></section>
  <footer class="site-footer" id="footer"></footer>
</div>

<script>
const CATALOG = /*@@CATALOG@@*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('zh-CN');

/* 封面：该交易员每月发推量的面积图（真实数据）。
   SVG 只画线和面（会被拉伸），年份与峰值点用 HTML 按百分比叠加，避免文字和圆点变形。 */
function cover(k, feature = false) {
  const W = 420, H = 200, P = 16, TOP = 34, BOT = 24, s = k.monthly;
  if (!s.length) return '';
  const max = Math.max(...s.map(m => m[1]));
  const fx = i => s.length === 1 ? .5 : i / (s.length - 1);
  const x = i => P + (W - 2 * P) * fx(i);
  const y = v => H - BOT - (H - TOP - BOT) * (v / max);
  const pts = s.map((m, i) => [x(i), y(m[1])]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = `${line} L${x(s.length - 1).toFixed(1)} ${H - BOT} L${x(0).toFixed(1)} ${H - BOT} Z`;
  const pk = s.findIndex(m => m[1] === max);
  // 只在每年 1 月标年份；首月不是 1 月且离下一个 1 月超过 6 个月时，首月也标
  const years = [];
  s.forEach((m, i) => { if (m[0].endsWith('-01')) years.push([i, m[0].slice(0, 4)]); });
  if (!s[0][0].endsWith('-01') && (!years.length || years[0][0] > 6)) years.unshift([0, s[0][0].slice(0, 4)]);
  const step = years.length > 6 ? 2 : 1;
  const pct = (px, total) => (px / total * 100).toFixed(2) + '%';
  const gl = [.33, .66].map(f => { const yy = (TOP + (H - TOP - BOT) * f).toFixed(1); return `<line class="grid" x1="${P}" x2="${W - P}" y1="${yy}" y2="${yy}"/>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${gl}
      <line class="grid" x1="${P}" x2="${W - P}" y1="${H - BOT}" y2="${H - BOT}"/>
      <path class="area" d="${area}"/><path class="line" d="${line}"/></svg>
    <span class="peak" style="left:${pct(pts[pk][0], W)};top:${pct(pts[pk][1], H)}" title="${s[pk][0]} · ${max} 篇"></span>
    ${years.filter((_, i) => i % step === 0).filter(([i]) => feature || fx(i) > .16).map(([i, yr]) => `<span class="yr" style="left:${pct(x(i), W)}">${yr}</span>`).join('')}
    <span class="cap">月发推量 · 峰值 ${s[pk][0].replace('-', '.')} ${max} 篇</span>`;
}
const avatar = k => k.avatar ? `<img class="avatar" loading="lazy" src="${esc(k.avatarLocal)}" data-remote="${esc(k.avatarRemote)}" alt="">` : '';

function card(k, feature = false) {
  return `<a class="card${feature ? ' feature' : ''}" href="${k.slug}/index.html" data-search="${esc([k.name, k.handle, k.ribbon, k.book, (k.tags || []).join(' '), k.summary].join(' ').toLowerCase())}">
    <div class="cover">${cover(k, feature)}${avatar(k)}</div>
    <div class="card-body">
      ${k.ribbon ? `<div class="rib">${esc(k.ribbon)}</div>` : ''}
      <div class="who"><b>${esc(k.name)}</b><span>@${esc(k.handle)}${k.followers ? ' · ' + esc(k.followers) : ''}</span></div>
      ${k.book ? `<p class="book">${esc(k.book)}</p>` : ''}
      ${feature && k.tags?.length ? `<div class="tags">${k.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
      <p class="sum">${esc(k.summary)}</p>
      <div class="kpis">
        <div><b>${fmt(k.tweets)}</b>原创推文</div>
        <div><b>${fmt(k.featured)}</b>S/A 精选</div>
        <div><b>${k.vols}·${k.topics}</b>卷·节</div>
        ${k.articles ? `<div><b>${fmt(k.articles)}</b>长文</div>` : ''}
      </div>
    </div></a>`;
}

function render() {
  const K = CATALOG.kols, T = CATALOG.totals;
  $('#hero').innerHTML = `
    <div class="eyebrow">推特实战交易员 · 公开推文知识库</div>
    <h1>把散落在时间线里的交易认知，<br>整理成可以系统阅读的书。</h1>
    <p>收录 ${K.length} 位实战交易员的公开原推，按「卷 → 节 → 核心原则 / 实盘案例 / 踩坑避坑」重新编排，附思维模型、深度长文与原推出处。顺着目录读，或直接搜原话。</p>
    <div class="totals">
      <div><b>${K.length}</b><span>位交易员</span></div>
      <div><b>${fmt(T.tweets)}</b><span>篇去噪原推</span></div>
      <div><b>${fmt(T.featured)}</b><span>篇 S/A 精选</span></div>
      <div><b>${fmt(T.articles)}</b><span>篇深度长文 / 专访</span></div>
      <div><b>${fmt(T.models)}</b><span>条思维模型</span></div>
    </div>`;
  $('#listMeta').textContent = `点击卡片进入阅读 · 数据同步于 ${CATALOG.syncedAt}`;
  $('#feature').innerHTML = card(K[0], true);
  $('#grid').innerHTML = K.slice(1).map(k => card(k)).join('');
  const M = CATALOG.monographs || [];
  $('#monographs').innerHTML = M.length ? `<div class="sec-head"><h2>单篇典藏</h2><p>经典单篇长文，链接至原站与 PDF</p></div>
    ${M.map(m => `<div class="mono-card"><div>
      <div class="meta">${esc(m.author)}${m.note ? ' · ' + esc(m.note) : ''}</div>
      <h3>${esc(m.title)}</h3><p>${esc(m.summary)}</p></div>
      <div class="acts">${m.read ? `<a class="btn" href="${esc(m.read)}" target="_blank" rel="noopener">在线阅读 ↗</a>` : ''}${m.pdf ? `<a class="btn" href="${esc(m.pdf)}" target="_blank" rel="noopener">PDF ↗</a>` : ''}</div>
    </div>`).join('')}` : '';
  $('#footer').innerHTML = `数据来源：<a href="https://github.com/suoha888/Trader-Archives" target="_blank" rel="noopener">suoha888/Trader-Archives</a>（MIT）@ <code>${esc(CATALOG.commit.slice(0, 7))}</code>，同步于 ${esc(CATALOG.syncedAt)}。推文与图片版权归各原作者。<br>仅供学习研究，不构成投资建议。`;
}

render();
document.addEventListener('error', e => { const el = e.target; if (el.tagName === 'IMG' && el.dataset.remote && !el.dataset.fb) { el.dataset.fb = 1; el.src = el.dataset.remote; } }, true);
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let n = 0;
  document.querySelectorAll('.card').forEach(c => { const ok = !q || q.split(/\s+/).every(w => c.dataset.search.includes(w)); c.hidden = !ok; n += ok; });
  $('#none').hidden = n > 0;
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && $('#q').value) { $('#q').value = ''; $('#q').dispatchEvent(new Event('input')); }
});
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('kol-theme', document.documentElement.dataset.theme); } catch {}
});
try { const t = localStorage.getItem('kol-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</body>
</html>
